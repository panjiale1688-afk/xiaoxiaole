<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#17122b">
<title>彩虹消消乐</title>
<style>
:root{--bg:#120d25;--panel:rgba(255,255,255,.1);--text:#fff;--muted:#c8bfdc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 20% 0%,#50308a,#21173f 35%,#120d25 72%);overflow-x:hidden}
body{display:grid;place-items:center;min-height:100vh;min-height:100dvh;padding:14px}button,input{font:inherit}button{border:0;cursor:pointer;color:#fff;font-weight:800}.game{width:min(96vw,560px)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.brand h1{font-size:clamp(27px,7vw,42px);line-height:1;margin:0}.brand p{margin:7px 0 0;color:var(--muted);font-size:12px}.top-actions{display:flex;gap:7px}.icon-btn{width:42px;height:42px;border-radius:13px;background:var(--panel);border:1px solid #ffffff18;font-size:19px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.stat{padding:9px;text-align:center;border:1px solid #ffffff18;border-radius:15px;background:var(--panel)}.stat b{display:block;font-size:21px}.stat span{font-size:11px;color:var(--muted)}
.progress{height:5px;background:#ffffff15;border-radius:9px;overflow:hidden;margin-bottom:10px}.progress i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#f472b6,#a78bfa,#60a5fa);transition:width .25s}
#board{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;padding:8px;border-radius:21px;background:linear-gradient(145deg,#ffffff18,#00000035);border:1px solid #ffffff18;box-shadow:0 24px 60px #0007;touch-action:manipulation}.tile{position:relative;aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:clamp(20px,7vw,35px);cursor:pointer;user-select:none;transition:transform .12s,filter .12s,opacity .12s;box-shadow:inset 0 -4px 0 #0002,0 4px 9px #0003}.tile:hover{filter:brightness(1.1)}.tile.selected{outline:3px solid #fff;transform:scale(.9);box-shadow:0 0 0 5px #ffffff25}.tile.empty{opacity:0;transform:scale(.35)}.tile.rocketH,.tile.rocketV{box-shadow:inset 0 -4px 0 #0002,0 0 0 2px #fff8,0 0 18px #7dd3fc99}.tile.bomb{box-shadow:inset 0 -4px 0 #0002,0 0 0 2px #fff8,0 0 18px #fb718599}.tile.rainbow{background:radial-gradient(circle,#fff 0 10%,#f9a8d4 11% 25%,#a78bfa 26% 42%,#60a5fa 43% 58%,#34d399 59% 72%,#facc15 73%)}.special-mark{position:absolute;right:4px;top:3px;font-size:11px}.message{text-align:center;min-height:25px;margin:10px 0 4px;font-weight:800;color:#fef3c7}.hint{text-align:center;color:#aaa0c2;font-size:11px}.combo{position:fixed;z-index:20;pointer-events:none;font-size:clamp(30px,10vw,62px);font-weight:1000;text-shadow:0 5px 20px #0008;animation:combo .8s ease forwards}
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:22px;background:#080511b8;backdrop-filter:blur(14px);opacity:1;transition:opacity .25s}.overlay.hidden{opacity:0;pointer-events:none}.modal{width:min(92vw,430px);padding:25px;border:1px solid #ffffff20;border-radius:28px;background:linear-gradient(160deg,#2b2050,#171126);box-shadow:0 30px 90px #0009;text-align:center}.modal .emoji{font-size:65px}.modal h2{margin:8px 0;font-size:29px}.modal p{margin:7px 0;color:var(--muted);font-size:14px}.name-input{width:100%;margin:16px 0 10px;padding:13px 15px;border-radius:14px;border:1px solid #ffffff20;background:#090714;color:#fff;outline:none;text-align:center}.primary,.secondary{width:100%;padding:13px;border-radius:14px;margin-top:8px}.primary{background:linear-gradient(135deg,#8b5cf6,#ec4899)}.secondary{background:#ffffff12;border:1px solid #ffffff16}.leaderboard{max-height:60vh;overflow:auto;margin:14px 0}.rank{display:grid;grid-template-columns:42px 1fr auto;gap:8px;align-items:center;padding:10px 7px;border-bottom:1px solid #ffffff0c;text-align:left}.rank strong{font-size:20px}.rank .player{font-weight:750}.rank .points{color:#ffd166;font-weight:900}.gameover-score{font-size:40px;font-weight:1000;color:#ffd166;margin:8px 0}
@keyframes combo{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}20%{transform:translate(-50%,-50%) scale(1.1);opacity:1}100%{transform:translate(-50%,-70%) scale(1.2);opacity:0}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}.shake{animation:shake .22s ease}@media(max-width:420px){body{padding:10px}.game{width:98vw}#board{gap:4px;padding:6px}.tile{border-radius:9px}}
</style>
</head>
<body>
<main class="game">
<header class="top"><div class="brand"><h1>🌈 彩虹消消乐</h1><p>连消越多，分数越高！</p></div><div class="top-actions"><button class="icon-btn" id="soundBtn">🔊</button><button class="icon-btn" id="rankBtn">🏆</button></div></header>
<section class="stats"><div class="stat"><b id="score">0</b><span>得分</span></div><div class="stat"><b id="moves">30</b><span>剩余步数</span></div><div class="stat"><b id="best">0</b><span>最高分</span></div></section>
<div class="progress"><i id="progress"></i></div><div id="board"></div><div id="message" class="message">准备开始！</div><div class="hint">🍬 四连火箭　💣 L/T 形炸弹　🌈 五连彩虹</div>
</main>
<div class="overlay" id="startOverlay"><div class="modal"><div class="emoji">🌈</div><h2>彩虹消消乐</h2><p>交换相邻方块，三个或以上相同即可消除</p><input id="nameInput" class="name-input" maxlength="10" placeholder="输入你的昵称（可选）"><button class="primary" id="startBtn">开始游戏 ▶</button><button class="secondary" id="startRankBtn">🏆 查看排行榜</button></div></div>
<div class="overlay hidden" id="gameOverOverlay"><div class="modal"><div class="emoji" id="overEmoji">🎉</div><h2 id="overTitle">游戏结束</h2><p>本局得分</p><div class="gameover-score" id="overScore">0</div><p id="overRank"></p><button class="primary" id="againBtn">再来一局 🔥</button><button class="secondary" id="overRankBtn">🏆 排行榜</button></div></div>
<div class="overlay hidden" id="rankOverlay"><div class="modal"><div class="emoji">🏆</div><h2>本地排行榜</h2><p>只保存在这台设备上</p><div class="leaderboard" id="leaderboard"></div><button class="secondary" id="closeRankBtn">返回游戏</button></div></div>
<script>
(()=>{
const N=8,TYPES=['🍓','🍋','🍏','🫐','🍇','🍊'];let board=[],selected=null,score=0,moves=30,busy=false,started=false;let soundOn=localStorage.getItem('xiaoxiaole-sound')!=='off',player=localStorage.getItem('xiaoxiaole-player')||'玩家';const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));let audio=null;
function beep(f=520,d=.07){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=.035;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function makeCell(type,special=null){return {type,special}}
function rand(){return Math.floor(Math.random()*TYPES.length)}
function makeBoard(){do{board=Array.from({length:N},()=>Array(N));for(let r=0;r<N;r++)for(let c=0;c<N;c++){let t;do{t=rand()}while(c>=2&&board[r][c-1].type===t&&board[r][c-2].type===t||r>=2&&board[r-1][c].type===t&&board[r-2][c].type===t);board[r][c]=makeCell(t)}}while(!hasPossibleMove())}
function render(){ $('score').textContent=score;$('moves').textContent=moves;$('best').textContent=Math.max(score,+(localStorage.getItem('xiaoxiaole-best')||0));$('progress').style.width=moves/30*100+'%';let root=$('board');root.innerHTML='';for(let r=0;r<N;r++)for(let c=0;c<N;c++){let v=board[r][c],e=document.createElement('div');e.className='tile'+(!v?' empty':'')+(selected&&selected.r===r&&selected.c===c?' selected':'');if(v){e.textContent=v.special==='rainbow'?'🌈':v.special==='bomb'?'💣':v.special?'🚀':TYPES[v.type];if(v.special){let m=document.createElement('span');m.className='special-mark';m.textContent=v.special==='rocketH'?'↔':v.special==='rocketV'?'↕':v.special==='bomb'?'✦':'';e.appendChild(m);e.classList.add(v.special)}}e.onclick=()=>pick(r,c);root.appendChild(e)}}
function findMatches(){let out=new Set();for(let r=0;r<N;r++){let c=0;while(c<N){if(!board[r][c]){c++;continue}let t=board[r][c].type,s=c;c++;while(c<N&&board[r][c]&&board[r][c].type===t)c++;if(c-s>=3)for(let x=s;x<c;x++)out.add(r+','+x)}}for(let c=0;c<N;c++){let r=0;while(r<N){if(!board[r][c]){r++;continue}let t=board[r][c].type,s=r;r++;while(r<N&&board[r][c]&&board[r][c].type===t)r++;if(r-s>=3)for(let y=s;y<r;y++)out.add(y+','+c)}}return out}
function hasPossibleMove(){for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(let [dr,dc] of [[1,0],[0,1]]){let nr=r+dr,nc=c+dc;if(nr>=N||nc>=N)continue;[board[r][c],board[nr][nc]]=[board[nr][nc],board[r][c]];let ok=findMatches().size>0||board[r][c]?.special||board[nr][nc]?.special;[board[r][c],board[nr][nc]]=[board[nr][nc],board[r][c]];if(ok)return true}return false}
function adjacent(a,b){return Math.abs(a.r-b.r)+Math.abs(a.c-b.c)===1}
function pick(r,c){if(!started||busy||moves<=0||!board[r][c])return;if(!selected){selected={r,c};render();return}if(selected.r===r&&selected.c===c){selected=null;render();return}if(!adjacent(selected,{r,c})){selected={r,c};render();return}let a=selected,b={r,c};selected=null;swap(a,b)}
async function swap(a,b){busy=true;beep(380);[board[a.r][a.c],board[b.r][b.c]]=[board[b.r][b.c],board[a.r][a.c]];render();await sleep(120);let matches=findMatches();let specialMove=board[a.r][a.c]?.special||board[b.r][b.c]?.special;if(!matches.size&&!specialMove){[board[a.r][a.c],board[b.r][b.c]]=[board[b.r][b.c],board[a.r][a.c]];render();$('message').textContent='这里不能消除，换个位置试试！';$('board').classList.add('shake');setTimeout(()=>$('board').classList.remove('shake'),250);busy=false;return}moves--;await resolve(matches,a,b);busy=false;if(moves<=0)endGame();else if(!hasPossibleMove()){ $('message').textContent='没有可消除的组合，自动重新生成棋盘！';await sleep(700);makeBoard();render()}}
function expandSpecials(set){let result=new Set(set),again=true;while(again){again=false;for(let key of [...result]){let [r,c]=key.split(',').map(Number),v=board[r][c];if(!v)continue;if(v.special==='rocketH'){for(let x=0;x<N;x++)if(!result.has(r+','+x)){result.add(r+','+x);again=true}}else if(v.special==='rocketV'){for(let y=0;y<N;y++)if(!result.has(y+','+c)){result.add(y+','+c);again=true}}else if(v.special==='bomb'){for(let y=Math.max(0,r-1);y<=Math.min(N-1,r+1);y++)for(let x=Math.max(0,c-1);x<=Math.min(N-1,c+1);x++)if(!result.has(y+','+x)){result.add(y+','+x);again=true}}else if(v.special==='rainbow'){let t=v.type;for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(board[y][x]?.type===t&&!result.has(y+','+x)){result.add(y+','+x);again=true}}}}return result}
function matchShape(set){let rows={},cols={};for(let k of set){let [r,c]=k.split(',').map(Number);rows[r]=(rows[r]||0)+1;cols[c]=(cols[c]||0)+1}return {maxRow:Math.max(0,...Object.values(rows)),maxCol:Math.max(0,...Object.values(cols))}}
function chooseSpecial(set,a,b){let shape=matchShape(set),pos=set.has(a.r+','+a.c)?a:(set.has(b.r+','+b.c)?b:null);if(shape.maxRow>=5||shape.maxCol>=5)return {pos:pos||firstPos(set),special:'rainbow'};if(shape.maxRow>=3&&shape.maxCol>=3)return {pos:pos||firstPos(set),special:'bomb'};if(shape.maxRow>=4)return {pos:pos||firstPos(set),special:'rocketH'};if(shape.maxCol>=4)return {pos:pos||firstPos(set),special:'rocketV'};return null}
function firstPos(set){let k=[...set][0],p=k.split(',').map(Number);return {r:p[0],c:p[1]}}
async function resolve(matches,a,b){let combo=0;while(matches.size){combo++;let special=chooseSpecial(matches,a,b);let cleared=expandSpecials(matches);score+=cleared.size*10*combo;beep(650+combo*80,.09);for(let k of cleared){let [r,c]=k.split(',').map(Number);board[r][c]=null}if(special){let p=special.pos;board[p.r][p.c]=makeCell(special.special==='rainbow'?rand():rand(),special.special)}render();if(combo>1)showCombo(combo);await sleep(240);for(let c=0;c<N;c++){let w=N-1;for(let r=N-1;r>=0;r--)if(board[r][c])board[w--][c]=board[r][c];for(let r=w;r>=0;r--)board[r][c]=makeCell(rand())}render();await sleep(160);matches=findMatches();a=b={r:-99,c:-99}}
let best=Math.max(score,+(localStorage.getItem('xiaoxiaole-best')||0));localStorage.setItem('xiaoxiaole-best',best);$('message').textContent=combo>=3?'🔥 超级连消 '+combo+' 次！':combo===2?'✨ 双连击！':'漂亮！继续消除！'}
function showCombo(n){let e=document.createElement('div');e.className='combo';e.textContent='COMBO ×'+n+' 🔥';e.style.left='50%';e.style.top='45%';document.body.appendChild(e);setTimeout(()=>e.remove(),800)}
function saveScore(){let list=JSON.parse(localStorage.getItem('xiaoxiaole-rank')||'[]');list.push({name:player||'玩家',score});list.sort((a,b)=>b.score-a.score);list=list.slice(0,10);localStorage.setItem('xiaoxiaole-rank',JSON.stringify(list));return list.findIndex(x=>x.name===player&&x.score===score)+1}
function renderRank(){let list=JSON.parse(localStorage.getItem('xiaoxiaole-rank')||'[]');$('leaderboard').innerHTML=list.length?list.map((x,i)=>'<div class="rank"><strong>'+(['🥇','🥈','🥉'][i]||i+1)+'</strong><span class="player">'+safe(x.name)+'</span><span class="points">'+x.score+'</span></div>').join(''):'<p>还没有记录，来当第一名吧！</p>'}
function safe(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function open(id){$(id).classList.remove('hidden')}function close(id){$(id).classList.add('hidden')}
function restart(){score=0;moves=30;selected=null;busy=false;makeBoard();$('message').textContent='开始你的第一步吧！';render()}
function startGame(){player=($('nameInput').value.trim()||'玩家').slice(0,10);localStorage.setItem('xiaoxiaole-player',player);started=true;close('startOverlay');close('gameOverOverlay');restart()}
function endGame(){started=false;let rank=saveScore();$('overScore').textContent=score;$('overRank').textContent=rank>0?'🎉 '+player+' 进入本地排行榜第 '+rank+' 名！':'继续努力，冲进前十！';$('overEmoji').textContent=score>=1000?'👑':score>=500?'🎉':'🌟';$('overTitle').textContent=score>=1000?'太厉害了！':'游戏结束';open('gameOverOverlay');renderRank()}
$('startBtn').onclick=startGame;$('againBtn').onclick=startGame;$('rankBtn').onclick=()=>{renderRank();open('rankOverlay')};$('startRankBtn').onclick=()=>{renderRank();open('rankOverlay')};$('overRankBtn').onclick=()=>{close('gameOverOverlay');renderRank();open('rankOverlay')};$('closeRankBtn').onclick=()=>close('rankOverlay');$('soundBtn').onclick=()=>{soundOn=!soundOn;localStorage.setItem('xiaoxiaole-sound',soundOn?'on':'off');$('soundBtn').textContent=soundOn?'🔊':'🔇';if(soundOn)beep()};$('soundBtn').textContent=soundOn?'🔊':'🔇';$('nameInput').value=player;makeBoard();render();
})();
</script>
</body>
</html>
