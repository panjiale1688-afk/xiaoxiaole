<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#17122b" />
<title>彩虹消消乐</title>
<style>
:root{--bg:#120d25;--panel:rgba(255,255,255,.1);--text:#fff;--muted:#c8bfdc;--accent:#8b5cf6;--gold:#ffd166;--danger:#ff5d73}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 20% 0%,#50308a 0,#21173f 34%,#120d25 72%);overflow-x:hidden}
body{display:grid;place-items:center;min-height:100vh;min-height:100dvh;padding:16px}
button,input{font:inherit}button{border:0;cursor:pointer;color:#fff;font-weight:800}
.game{width:min(96vw,560px);position:relative;z-index:1}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.brand h1{font-size:clamp(27px,7vw,42px);line-height:1;margin:0;text-shadow:0 5px 20px #0005}.brand p{margin:7px 0 0;color:var(--muted);font-size:12px}.top-actions{display:flex;gap:7px}.icon-btn{width:42px;height:42px;border-radius:13px;background:var(--panel);border:1px solid #ffffff18;backdrop-filter:blur(12px);font-size:19px;box-shadow:0 7px 18px #0003}.icon-btn:active,.primary:active,.secondary:active{transform:scale(.96)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.stat{padding:9px 7px;text-align:center;border:1px solid #ffffff18;border-radius:15px;background:var(--panel);backdrop-filter:blur(14px);box-shadow:0 8px 25px #0002}.stat b{display:block;font-size:21px}.stat span{font-size:11px;color:var(--muted)}
.progress{height:5px;background:#ffffff15;border-radius:9px;overflow:hidden;margin-bottom:10px}.progress i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#f472b6,#a78bfa,#60a5fa);transition:width .25s}
#board{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;padding:8px;border-radius:21px;background:linear-gradient(145deg,#ffffff18,#00000035);border:1px solid #ffffff18;box-shadow:0 24px 60px #0007;touch-action:manipulation}.tile{position:relative;aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:clamp(20px,7vw,35px);cursor:pointer;user-select:none;transition:transform .12s,filter .12s,opacity .12s;box-shadow:inset 0 -4px 0 #0002,0 4px 9px #0003}.tile:hover{filter:brightness(1.1);transform:translateY(-1px)}.tile.selected{outline:3px solid #fff;transform:scale(.9);box-shadow:0 0 0 5px #ffffff25}.tile.empty{opacity:0;transform:scale(.35)}.tile.matched{animation:pop .3s ease forwards}.tile.rocket{box-shadow:inset 0 -4px 0 #0002,0 0 0 2px #fff8,0 0 18px #7dd3fc99}.tile.bomb{box-shadow:inset 0 -4px 0 #0002,0 0 0 2px #fff8,0 0 18px #fb718599}.tile.rainbow{background:radial-gradient(circle,#fff 0 10%,#f9a8d4 11% 25%,#a78bfa 26% 42%,#60a5fa 43% 58%,#34d399 59% 72%,#facc15 73%)}.special-mark{position:absolute;right:4px;top:3px;font-size:11px;filter:drop-shadow(0 1px 2px #000)}
.message{text-align:center;min-height:25px;margin:10px 0 4px;font-weight:800;color:#fef3c7}.hint{text-align:center;color:#aaa0c2;font-size:11px}.combo{position:fixed;z-index:20;pointer-events:none;font-size:clamp(30px,10vw,62px);font-weight:1000;text-shadow:0 5px 20px #0008;animation:combo .8s ease forwards}.float-score{position:fixed;z-index:20;pointer-events:none;font-size:22px;font-weight:900;color:#ffe082;text-shadow:0 2px 8px #000;animation:floatUp .8s ease forwards}
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:22px;background:#080511b8;backdrop-filter:blur(14px);opacity:1;transition:opacity .25s}.overlay.hidden{opacity:0;pointer-events:none}.modal{width:min(92vw,430px);padding:25px;border:1px solid #ffffff20;border-radius:28px;background:linear-gradient(160deg,#2b2050,#171126);box-shadow:0 30px 90px #0009;text-align:center;transform:translateY(0) scale(1);transition:transform .25s}.overlay.hidden .modal{transform:translateY(15px) scale(.96)}.modal .emoji{font-size:65px}.modal h2{margin:8px 0;font-size:29px}.modal p{margin:7px 0;color:var(--muted);font-size:14px}.name-input{width:100%;margin:16px 0 10px;padding:13px 15px;border-radius:14px;border:1px solid #ffffff20;background:#090714;color:#fff;outline:none;text-align:center}.name-input:focus{border-color:#a78bfa}.primary,.secondary{width:100%;padding:13px;border-radius:14px;margin-top:8px}.primary{background:linear-gradient(135deg,#8b5cf6,#ec4899);box-shadow:0 10px 24px #8b5cf644}.secondary{background:#ffffff12;border:1px solid #ffffff16}.small-note{font-size:11px!important;color:#9d93b1!important;margin-top:12px!important}
.leaderboard{max-height:60vh;overflow:auto;margin:14px 0}.rank{display:grid;grid-template-columns:42px 1fr auto;gap:8px;align-items:center;padding:10px 7px;border-bottom:1px solid #ffffff0c;text-align:left}.rank strong{font-size:20px}.rank .player{font-weight:750}.rank .points{color:#ffd166;font-weight:900}.rank.me{background:#ffffff0b;border-radius:12px}.gameover-score{font-size:40px;font-weight:1000;color:#ffd166;margin:8px 0}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(0);opacity:0}}@keyframes combo{0%{transform:translate(-50%,-50%) scale(.5) rotate(-8deg);opacity:0}20%{transform:translate(-50%,-50%) scale(1.1) rotate(3deg);opacity:1}100%{transform:translate(-50%,-70%) scale(1.2);opacity:0}}@keyframes floatUp{0%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-70px);opacity:0}}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}.shake{animation:shake .22s ease}
@media(max-width:420px){body{padding:10px}.game{width:98vw}.tile{border-radius:9px}#board{gap:4px;padding:6px}.brand p{font-size:11px}.stat{padding:7px 5px}}
</style>
</head>
<body>
<main class="game">
  <header class="top">
    <div class="brand"><h1>🌈 彩虹消消乐</h1><p>连消越多，分数越高！</p></div>
    <div class="top-actions"><button class="icon-btn" id="soundBtn" title="声音">🔊</button><button class="icon-btn" id="rankBtn" title="排行榜">🏆</button></div>
  </header>
  <section class="stats"><div class="stat"><b id="score">0</b><span>得分</span></div><div class="stat"><b id="moves">30</b><span>剩余步数</span></div><div class="stat"><b id="best">0</b><span>最高分</span></div></section>
  <div class="progress"><i id="progress"></i></div>
  <div id="board" aria-label="消消乐棋盘"></div>
  <div id="message" class="message">准备开始！</div>
  <div class="hint">🍬 四连生成火箭　💣 L/T 形生成炸弹　🌈 五连生成彩虹</div>
</main>

<div class="overlay" id="startOverlay"><div class="modal"><div class="emoji">🌈</div><h2>彩虹消消乐</h2><p>交换相邻方块，三个或以上相同即可消除</p><input id="nameInput" class="name-input" maxlength="10" placeholder="输入你的昵称（可选）" /><button class="primary" id="startBtn">开始游戏 ▶</button><button class="secondary" id="startRankBtn">🏆 查看排行榜</button><p class="small-note">支持连击、特殊方块、音效和本地排行榜</p></div></div>
<div class="overlay hidden" id="gameOverOverlay"><div class="modal"><div class="emoji" id="overEmoji">🎉</div><h2 id="overTitle">游戏结束</h2><p>本局得分</p><div class="gameover-score" id="overScore">0</div><p id="overRank"></p><button class="primary" id="againBtn">再来一局 🔥</button><button class="secondary" id="overRankBtn">🏆 排行榜</button></div></div>
<div class="overlay hidden" id="rankOverlay"><div class="modal"><div class="emoji">🏆</div><h2>本地排行榜</h2><p>只保存在这台设备上</p><div class="leaderboard" id="leaderboard"></div><button class="secondary" id="closeRankBtn">返回游戏</button></div></div>

<script>
(()=>{
const SIZE=8, TYPES=['🍓','🍋','🍏','🫐','🍇','🍊'];
let board=[],selected=null,score=0,moves=30,busy=false,started=false,soundOn=localStorage.getItem('xiaoxiaole-sound')!=='off',player=localStorage.getItem('xiaoxiaole-player')||'玩家';
const $=id=>document.getElementById(id); const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let audioCtx=null;
function beep(freq=520,dur=.08,type='sine',gain=.035){if(!soundOn)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(gain,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}catch(e){}}
function soundSwap(){beep(380,.05,'triangle')} function soundClear(){beep(620,.07,'sine');setTimeout(()=>beep(820,.09,'sine'),55)} function soundCombo(n){beep(500+n*100,.12,'square',.045)}
function cell(type,special=null){return type===null?null:{type,special}}
function randomTile(){return Math.floor(Math.random()*TYPES.length)}
function makeBoard(){board=Array.from({length:SIZE},()=>Array(SIZE));for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){let t;do{t=randomTile()}while((c>=2&&board[r][c-1]?.type===t&&board[r][c-2]?.type===t)||(r>=2&&board[r-1][c]?.type===t&&board[r-2][c]?.type===t));board[r][c]=cell(t)}}
function render(){ $('score').textContent=score;$('moves').textContent=moves;$('best').textContent=Math.max(score,Number(localStorage.getItem('xiaoxiaole-best')||0));$('progress').style.width=(moves/30*100)+'%';const root=$('board');root.innerHTML='';board.forEach((row,r)=>row.forEach((v,c)=>{const el=document.createElement('div');el.className='tile'+(!v?' empty':'')+(selected&&selected.r===r&&selected.c===c?' selected':'');if(v){el.textContent=v.special==='rainbow'?'🌈':v.special==='rocketH'?'🚀':v.special==='rocketV'?'🚀':v.special==='bomb'?'💣':TYPES[v.type];if(v.special){const mark=document.createElement('span');mark.className='special-mark';mark.textContent=v.special==='rocketH'?'↔':v.special==='rocketV'?'↕':v.special==='bomb'?'✦':'';el.appendChild(mark);el.classList.add(v.special)}}el.dataset.r=r;el.dataset.c=c;el.addEventListener('click',()=>pick(r,c));root.appendChild(el)}))}
function adjacent(a,b){return Math.abs(a.r-b.r)+Math.abs(a.c-b.c)===1}
function pick(r,c){if(!started||busy||moves<=0||!board[r][c])return;if(!selected){selected={r,c};render();beep(440,.04);return}if(selected.r===r&&selected.c===c){selected=null;render();return}if(!adjacent(selected,{r,c})){selected={r,c};render();return}swap(selected,{r,c});selected=null}
async function swap(a,b){busy=true;soundSwap();[board[a.r][a.c],board[b.r][b.c]]=[board[b.r][b.c],board[a.r][a.c]];render();await sleep(130);let matches=findMatches();if(!matches.size&&!board[a.r][a.c]?.special&&!board[b.r][b.c]?.special){[board[a.r][a.c],board[b.r][b.c]]=[board[b.r][b.c],board[a.r][a.c]];render();$('message').textContent='这里不能消除，换个位置试试！';$('board').classList.add('shake');setTimeout(()=>$('board').classList.remove('shake'),240);busy=false;return}moves--;await resolve(matches,a,b);busy=false;if(moves<=0)endGame();else if(!hasPossibleMove()){$('message').textContent='没有可移动的组合，重新开始试试！';setTimeout(()=>restart(),1300)}}
function findMatches(){const set=new Set();for(let r=0;r<SIZE;r++){let start=0;for(let c=1;c<=SIZE;c++){if(c<SIZE&&board[r][c]&&board[r][c].type===board[r][start]?.type)continue;if(c-start>=3&&board[r][start])for(let x=start;x<c;x++)set.add(r+','+x);start=c}}for(let c=0;c<SIZE;c++){let start=0;for(let r=1;r<=SIZE;r++){if(r<SIZE&&board[r][c]&&board[r][c].type===board[start]?.type)continue;if(r-start>=3&&board[start][c])for(let x=start;x<r;x++)set.add(x+','+c);start=r}}return set}
function runInfo(matches){let best5=null,best4=null;for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){if(!board[r][c])continue;let t=board[r][c].type;let len=1;while(c+len<SIZE&&board[r][c+len]?.type===t)len++;if(len>=5)best5={r,c,len,dir:'h'};else if(len>=4)best4={r,c,len,dir:'h'}}for(let c=0;c<SIZE;c++)for(let r=0;r<SIZE;r++){if(!board[r][c])continue;let t=board[r][c].type;let len=1;while(r+len<SIZE&&board[r+len][c]?.type===t)len++;if(len>=5)best5={r,c,len,dir:'v'};else if(len>=4&&!best4)best4={r,c,len,dir:'v'}}return {best5,best4}}
function activateSpecials(matches){const extra=new Set(matches);const rainbowTypes=new Set();matches.forEach(k=>{const [r,c]=k.split(',').map(Number),v=board[r][c];if(v?.special==='rocketH'){for(let x=0;x<SIZE;x++)extra.add(r+','+x)}else if(v?.special==='rocketV'){for(let y=0;y<SIZE;y++)extra.add(y+','+c)}else if(v?.special==='bomb'){for(let y=Math.max(0,r-1);y<=Math.min(SIZE-1,r+1);y++)for(let x=Math.max(0,c-1);x<=Math.min(SIZE-1,c+1);x++)extra.add(y+','+x)}else if(v?.special==='rainbow'){rainbowTypes.add(v.type)}});rainbowTypes.forEach(t=>{for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(board[r][c]?.type===t)extra.add(r+','+c)});return extra}
async function resolve(matches,swapA,swapB){let combo=0;while(matches.size){combo++;const info=runInfo(matches);const activated=activateSpecials(matches);const count=activated.size;score+=count*10*combo;if(count>=3)soundClear();activated.forEach(k=>{const [r,c]=k.split(',').map(Number);board[r][c]=null});if(info.best5){const p=(board[swapA.r][swapA.c]?'':null);let pos=matches.has(swapA.r+','+swapA.c)?swapA:swapB;if(!board[pos.r][pos.c]){const candidates=[info.best5];pos={r:candidates[0].r,c:candidates[0].c}}board[pos.r][pos.c]=cell(info.best5?info.best5.len>=5?0:0:0,'rainbow')}else if(info.best4){let pos=matches.has(swapA.r+','+swapA.c)?swapA:swapB;if(!board[pos.r][pos.c])pos={r:info.best4.r,c:info.best4.c};const vertical=info.best4.dir==='v';board[pos.r][pos.c]=cell(randomTile(),vertical?'rocketV':'rocketH')}else{ // L/T 形：用匹配集合的交点生成炸弹
let bombPos=null;for(const k of matches){const [r,c]=k.split(',').map(Number);let h=0,v=0;for(let x=0;x<SIZE;x++)if(matches.has(r+','+x))h++;for(let y=0;y<SIZE;y++)if(matches.has(y+','+c))v++;if(h>=3&&v>=3){bombPos={r,c};break}}if(bombPos&&activated.has(bombPos.r+','+bombPos.c))board[bombPos.r][bombPos.c]=cell(randomTile(),'bomb')}
render();if(combo>1){showCombo(combo);soundCombo(combo)}await sleep(240);for(let c=0;c<SIZE;c++){let write=SIZE-1;for(let r=SIZE-1;r>=0;r--)if(board[r][c])board[write--][c]=board[r][c];for(let r=write;r>=0;r--)board[r][c]=cell(randomTile())}render();await sleep(170);matches=findMatches()}
const best=Math.max(score,Number(localStorage.getItem('xiaoxiaole-best')||0));localStorage.setItem('xiaoxiaole-best',best);$('best').textContent=best;$('message').textContent=combo>=3?`🔥 超级连消 ${combo} 次！`:(combo===2?'✨ 双连击！':'漂亮！继续消除！')}
function showCombo(n){const e=document.createElement('div');e.className='combo';e.textContent=`COMBO ×${n} 🔥`;e.style.left='50%';e.style.top='47%';document.body.appendChild(e);setTimeout(()=>e.remove(),800)}
function showFloat(text,r,c){const el=document.createElement('div');el.className='float-score';el.textContent=text;const rect=$('board').getBoundingClientRect();el.style.left=(rect.left+(c+.5)*rect.width/SIZE)+'px';el.style.top=(rect.top+(r+.4)*rect.width/SIZE)+'px';document.body.appendChild(el);setTimeout(()=>el.remove(),800)}
function hasPossibleMove(){for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)for(const [dr,dc] of [[1,0],[0,1]]){const nr=r+dr,nc=c+dc;if(nr>=SIZE||nc>=SIZE)continue;[board[r][c],board[nr][nc]]=[board[nr][nc],board[r][c]];const ok=findMatches().size>0||board[r][c]?.special||board[nr][nc]?.special;[board[r][c],board[nr][nc]]=[board[nr][nc],board[r][c]];if(ok)return true}return false}
function saveScore(){const list=JSON.parse(localStorage.getItem('xiaoxiaole-rank')||'[]');list.push({name:player||'玩家',score,date:Date.now()});list.sort((a,b)=>b.score-a.score);localStorage.setItem('xiaoxiaole-rank',JSON.stringify(list.slice(0,10)));return list.findIndex(x=>x.name===player&&x.score===score)+1}
function renderRank(){const list=JSON.parse(localStorage.getItem('xiaoxiaole-rank')||'[]');$('leaderboard').innerHTML=list.length?list.map((x,i)=>`<div class="rank ${x.name===player&&x.score===score?'me':''}"><strong>${['🥇','🥈','🥉'][i]||i+1}</strong><span class="player">${escapeHtml(x.name)}</span><span class="points">${x.score}</span></div>`).join(''):'<p>还没有记录，来当第一名吧！</p>'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function openOverlay(id){$(id).classList.remove('hidden')}function closeOverlay(id){$(id).classList.add('hidden')}
function startGame(){player=($('nameInput').value.trim()||'玩家').slice(0,10);localStorage.setItem('xiaoxiaole-player',player);closeOverlay('startOverlay');closeOverlay('gameOverOverlay');started=true;restart()}
function restart(){score=0;moves=30;selected=null;busy=false;makeBoard();$('message').textContent='开始你的第一步吧！';render()}
function endGame(){started=false;const rank=saveScore();$('overScore').textContent=score;$('overRank').textContent=rank<=10?`🎉 ${player} 进入本地排行榜第 ${rank} 名！`:'继续努力，冲进前十！';$('overEmoji').textContent=score>=1000?'👑':score>=500?'🎉':'🌟';$('overTitle').textContent=score>=1000?'太厉害了！':'游戏结束';openOverlay('gameOverOverlay');renderRank()}
$('startBtn').onclick=startGame;$('againBtn').onclick=startGame;$('rankBtn').onclick=()=>{renderRank();openOverlay('rankOverlay')};$('startRankBtn').onclick=()=>{renderRank();openOverlay('rankOverlay')};$('overRankBtn').onclick=()=>{closeOverlay('gameOverOverlay');renderRank();openOverlay('rankOverlay')};$('closeRankBtn').onclick=()=>closeOverlay('rankOverlay');$('soundBtn').onclick=()=>{soundOn=!soundOn;localStorage.setItem('xiaoxiaole-sound',soundOn?'on':'off');$('soundBtn').textContent=soundOn?'🔊':'🔇';if(soundOn)beep()};$('soundBtn').textContent=soundOn?'🔊':'🔇';$('nameInput').value=player;
makeBoard();render();
})();
</script>
</body>
</html>
