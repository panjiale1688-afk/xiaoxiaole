<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>彩虹消消乐</title>
  <style>
    :root { --bg:#0f172a; --panel:rgba(255,255,255,.1); --text:#f8fafc; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--text); background:radial-gradient(circle at top,#334155,#0f172a 65%); }
    .game { width:min(94vw,560px); padding:24px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:18px; }
    h1 { margin:0; font-size:clamp(28px,7vw,44px); letter-spacing:-1px; }
    .sub { opacity:.7; font-size:13px; margin-top:4px; }
    button { border:0; color:white; background:#7c3aed; padding:11px 16px; border-radius:12px; font-weight:700; cursor:pointer; box-shadow:0 6px 18px rgba(124,58,237,.3); }
    button:hover { filter:brightness(1.08); }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
    .stat { background:var(--panel); border:1px solid rgba(255,255,255,.1); border-radius:14px; padding:12px; text-align:center; backdrop-filter:blur(12px); }
    .stat b { display:block; font-size:22px; }
    .stat span { opacity:.65; font-size:12px; }
    #board { display:grid; grid-template-columns:repeat(8,1fr); gap:7px; padding:10px; background:rgba(2,6,23,.55); border:1px solid rgba(255,255,255,.1); border-radius:20px; box-shadow:0 24px 70px rgba(0,0,0,.3); touch-action:manipulation; }
    .tile { aspect-ratio:1; border-radius:12px; display:grid; place-items:center; font-size:clamp(21px,7vw,36px); cursor:pointer; user-select:none; transition:transform .13s, filter .13s, opacity .13s; box-shadow:inset 0 -4px 0 rgba(0,0,0,.15), 0 4px 8px rgba(0,0,0,.16); }
    .tile:hover { transform:translateY(-2px) scale(1.03); filter:brightness(1.08); }
    .tile.selected { outline:4px solid rgba(255,255,255,.9); transform:scale(.92); }
    .tile.matched { animation:pop .25s ease forwards; }
    .empty { opacity:0; transform:scale(.5); }
    .message { text-align:center; min-height:25px; margin:14px 0 0; font-weight:700; }
    .hint { text-align:center; opacity:.55; font-size:12px; margin-top:6px; }
    @keyframes pop { 50% { transform:scale(1.15); } 100% { transform:scale(0); opacity:0; } }
    @media (max-width:420px) { .game { padding:14px; } #board { gap:5px; padding:7px; } .tile { border-radius:9px; } }
  </style>
</head>
<body>
  <main class="game">
    <header>
      <div><h1>🌈 彩虹消消乐</h1><div class="sub">交换相邻方块，三个或以上相同即可消除</div></div>
      <button id="restart">重新开始</button>
    </header>
    <section class="stats" aria-label="游戏数据">
      <div class="stat"><b id="score">0</b><span>得分</span></div>
      <div class="stat"><b id="moves">30</b><span>剩余步数</span></div>
      <div class="stat"><b id="best">0</b><span>最高分</span></div>
    </section>
    <div id="board" aria-label="消消乐棋盘"></div>
    <div id="message" class="message">开始你的第一步吧！</div>
    <div class="hint">也可以直接点击两个相邻方块进行交换</div>
  </main>
<script>
(() => {
  const SIZE=8, TYPES=['🍓','🍋','🍏','🫐','🍇','🍊'];
  let board=[], selected=null, score=0, moves=30, busy=false;
  const $=id=>document.getElementById(id);
  $('best').textContent=localStorage.getItem('xiaoxiaole-best')||0;

  function randomTile(){ return Math.floor(Math.random()*TYPES.length); }
  function makeBoard(){
    board=Array.from({length:SIZE},()=>Array(SIZE));
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
      let t;
      do { t=randomTile(); } while((c>=2&&board[r][c-1]===t&&board[r][c-2]===t)||(r>=2&&board[r-1][c]===t&&board[r-2][c]===t));
      board[r][c]=t;
    }
  }
  function render(){
    $('score').textContent=score; $('moves').textContent=moves;
    const root=$('board'); root.innerHTML='';
    board.forEach((row,r)=>row.forEach((t,c)=>{
      const el=document.createElement('div'); el.className='tile'+(t===null?' empty':'')+(selected&&selected.r===r&&selected.c===c?' selected':'');
      el.textContent=t===null?'':TYPES[t]; el.dataset.r=r; el.dataset.c=c;
      el.addEventListener('click',()=>pick(r,c)); root.appendChild(el);
    }));
  }
  function adjacent(a,b){ return Math.abs(a.r-b.r)+Math.abs(a.c-b.c)===1; }
  function pick(r,c){
    if(busy||moves<=0||board[r][c]===null) return;
    if(!selected){ selected={r,c}; render(); return; }
    if(selected.r===r&&selected.c===c){ selected=null; render(); return; }
    if(!adjacent(selected,{r,c})){ selected={r,c}; render(); return; }
    swap(selected,{r,c}); selected=null;
  }
  async function swap(a,b){
    busy=true; [board[a.r][a.c],board[b.r][b.c]]=[board[b.r][b.c],board[a.r][a.c]]; render();
    await sleep(140);
    let matches=findMatches();
    if(!matches.size){
      [board[a.r][a.c],board[b.r][b.c]]=[board[b.r][b.c],board[a.r][a.c]]; render();
      $('message').textContent='这里不能消除，换个位置试试！'; busy=false; return;
    }
    moves--; await resolve(matches); busy=false;
    if(moves<=0) endGame(); else if(!hasPossibleMove()) $('message').textContent='没有可移动的组合，点击“重新开始”继续！';
  }
  function findMatches(){
    const set=new Set();
    for(let r=0;r<SIZE;r++){
      let start=0;
      for(let c=1;c<=SIZE;c++){
        if(c<SIZE&&board[r][c]!==null&&board[r][c]===board[r][start]) continue;
        if(c-start>=3) for(let x=start;x<c;x++) set.add(`${r},${x}`);
        start=c;
      }
    }
    for(let c=0;c<SIZE;c++){
      let start=0;
      for(let r=1;r<=SIZE;r++){
        if(r<SIZE&&board[r][c]!==null&&board[r][c]===board[start][c]) continue;
        if(r-start>=3) for(let x=start;x<r;x++) set.add(`${x},${c}`);
        start=r;
      }
    }
    return set;
  }
  async function resolve(matches){
    let combo=1;
    while(matches.size){
      score += matches.size*10*combo;
      matches.forEach(k=>{ const [r,c]=k.split(',').map(Number); board[r][c]=null; });
      render(); await sleep(220);
      for(let c=0;c<SIZE;c++){
        let write=SIZE-1;
        for(let r=SIZE-1;r>=0;r--) if(board[r][c]!==null) board[write--][c]=board[r][c];
        for(let r=write;r>=0;r--) board[r][c]=randomTile();
      }
      render(); await sleep(180); matches=findMatches(); combo++;
    }
    const best=Math.max(score,Number(localStorage.getItem('xiaoxiaole-best')||0)); localStorage.setItem('xiaoxiaole-best',best); $('best').textContent=best;
    $('message').textContent=combo>2?`连消 ${combo-1} 次！太棒了！`:'漂亮！继续消除！';
  }
  function hasPossibleMove(){
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) for(const [dr,dc] of [[1,0],[0,1]]){
      const nr=r+dr,nc=c+dc; if(nr>=SIZE||nc>=SIZE) continue;
      [board[r][c],board[nr][nc]]=[board[nr][nc],board[r][c]]; const ok=findMatches().size>0; [board[r][c],board[nr][nc]]=[board[nr][nc],board[r][c]];
      if(ok) return true;
    }
    return false;
  }
  function endGame(){ $('message').textContent=`游戏结束！最终得分 ${score}，再来一局吧！`; }
  function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
  function restart(){ score=0; moves=30; selected=null; busy=false; makeBoard(); $('message').textContent='开始你的第一步吧！'; render(); }
  $('restart').addEventListener('click',restart); restart();
})();
</script>
</body>
</html>
